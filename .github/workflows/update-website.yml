name: Update Website Version

on:
  push:
    tags:
      - 'v*'

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update version in index.html
        run: |
          python3 - <<'EOF'
          import re, sys

          version = "${{ steps.version.outputs.VERSION }}"
          path = "docs/index.html"

          content = open(path).read()

          # Replace v1.2.3 or v1.2.3.4 display strings
          content = re.sub(r'v\d+\.\d+\.\d+(\.\d+)?', f'v{version}', content)

          # Replace softwareVersion JSON-LD field
          content = re.sub(
              r'"softwareVersion":\s*"[^"]+"',
              f'"softwareVersion": "{version}"',
              content
          )

          open(path, "w").write(content)
          print(f"Updated to v{version}")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "Auto-update website to v${{ steps.version.outputs.VERSION }} [skip ci]" && \
            git push origin main
